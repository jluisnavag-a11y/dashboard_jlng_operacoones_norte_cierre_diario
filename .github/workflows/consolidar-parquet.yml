name: Consolidar datos operativos

on:
  push:
    branches: [main]
    paths:
      - "datos_semanales/*.csv"
      - "datos_semanales/**/*.csv"
      - "app.py"
      - "generar_parquet.py"
      - ".github/workflows/consolidar-parquet.yml"
  workflow_dispatch:

# Necesario para que la automatización pueda publicar el Parquet actualizado.
permissions:
  contents: write

# Evita dos consolidaciones simultáneas cuando se cargan varios archivos.
concurrency:
  group: consolidado-parquet-main
  cancel-in-progress: false

jobs:
  construir-parquet:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener código y archivos fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Reconstruir consolidado completo
        run: python generar_parquet.py

      - name: Publicar Parquet si cambió
        run: |
          if git diff --quiet -- datos_semanales/datos_consolidados.parquet; then
            echo "El Parquet no tuvo cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos_semanales/datos_consolidados.parquet
          git commit -m "Automático: actualizar consolidado Parquet"
          git push
