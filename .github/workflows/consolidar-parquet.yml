name: Consolidar datos operativos

on:
  push:
    branches: [main]
    paths:
      - "datos_semanales/*.csv"
      - "datos_semanales/**/*.csv"
      - "app.py"
      - "generar_parquet.py"
      - ".github/workflows/consolidar-parquet.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidado-parquet-main
  cancel-in-progress: false

jobs:
  consolidar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar versión actual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Reconstruir y publicar consolidado
        run: |
          set -e

          for intento in 1 2 3; do
            echo "Intento $intento de 3"

            git fetch origin main
            git reset --hard origin/main

            python generar_parquet.py

            if git diff --quiet -- datos_semanales/datos_consolidados.parquet; then
              echo "El Parquet ya está actualizado."
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos_semanales/datos_consolidados.parquet
            git commit -m "Automático: actualizar consolidado Parquet"

            if git push origin HEAD:main; then
              echo "Parquet publicado correctamente."
              exit 0
            fi

            echo "Hubo un cambio simultáneo. Se reintentará con la versión más reciente."
            sleep 5
          done

          echo "No fue posible publicar tras tres intentos."
          exit 1
